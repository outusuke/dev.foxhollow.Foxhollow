name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Download Foxhollow launcher .deb
        run: curl -fL -o Foxhollow-amd64.deb https://cdn.foxhollow.dev/launcher/latest/Foxhollow-amd64.deb
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Foxhollow.flatpak
          manifest-path: dev.foxhollow.Foxhollow.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: Foxhollow.flatpak

  release:
    name: "Publish Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Foxhollow.flatpak
          generate_release_notes: true
          body: |
            Unofficial Flatpak of the Foxhollow launcher (repackaged from the official .deb).
            You need your own Star Fox Adventures disc dump (.iso / .rvz).

            Install:
              flatpak install --user Foxhollow.flatpak
              flatpak run dev.foxhollow.Foxhollow
